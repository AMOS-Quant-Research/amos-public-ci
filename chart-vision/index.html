<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMOS Chart Vision</title><style>body{background:#0b1220;color:#f3f5fa;font:16px system-ui;margin:20px}button,input{font:inherit;padding:12px;margin:8px 0}button{background:#3c86f5;color:white;border:0;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}article{background:#1b293c;border-radius:12px;padding:16px;white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>AMOS Chart Vision</h1><p>同じ画像を5系統に並列送信します。未接続は未接続と表示します。</p><input type="password" id="token" placeholder="Access token (if required)" autocomplete="off"><br><input type="file" id="file" accept="image/png,image/jpeg"><br><button id="go">5系統で解析</button><p id="status"></p><div id="out" class="grid"></div><script>document.getElementById('go').onclick=async()=>{const f=document.getElementById('file').files[0];if(!f)return;document.getElementById('status').textContent='解析中…';const b64=await new Promise((ok,no)=>{const r=new FileReader;r.onload=()=>ok(r.result.split(',')[1]);r.onerror=no;r.readAsDataURL(f)});try{const r=await fetch('/analyze',{method:'POST',headers:{'Content-Type':'application/json',...(document.getElementById('token').value?{'Authorization':'Bearer '+document.getElementById('token').value}:{})},body:JSON.stringify({image_base64:b64})});const data=await r.json();document.getElementById('out').replaceChildren();for(const [name,v] of Object.entries(data.results||{})){const a=document.createElement('article');a.textContent=name+'\n'+v.status+'\n'+(typeof v.report==='string'?v.report:JSON.stringify(v.report||v.error));document.getElementById('out').append(a)}if(data.consensus){const summary=document.createElement('article');summary.textContent='Consensus: '+JSON.stringify(data.consensus);document.getElementById('out').prepend(summary)}document.getElementById('status').textContent=r.ok?'完了':'エラー: '+JSON.stringify(data)}catch(e){document.getElementById('status').textContent=String(e)}};</script></html>
