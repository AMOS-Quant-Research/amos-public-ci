services:
  chart-vision:
    build: .
    restart: unless-stopped
    environment:
      AMOS_BIND: 0.0.0.0
      PORT: 8765
      AMOS_API_TOKEN: ${AMOS_API_TOKEN:?Set AMOS_API_TOKEN}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-llava}
      ADAPTER_TRADING_ANALYZER_URL: ${ADAPTER_TRADING_ANALYZER_URL:-}
      ADAPTER_CHART_VISION_MCP_URL: ${ADAPTER_CHART_VISION_MCP_URL:-}
      ADAPTER_SCREENCHART_URL: ${ADAPTER_SCREENCHART_URL:-}
      ADAPTER_OPENCHART_URL: ${ADAPTER_OPENCHART_URL:-}
    ports:
      - "127.0.0.1:8765:8765"
    depends_on:
      - ollama
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    expose:
      - "11434"
volumes:
  ollama-data:
