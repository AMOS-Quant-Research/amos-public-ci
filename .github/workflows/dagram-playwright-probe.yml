name: Dagram public Playwright probe
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/dagram/**'
      - '.github/workflows/dagram-playwright-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright==1.56.0 pandas==2.2.3
      - run: python -m playwright install --with-deps chromium
      - run: PYTHONPATH=. python -m unittest research.dagram.test_vibe_signal_bridge -v
      - run: python research/dagram/probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dagram-public-probe
          path: artifacts/dagram/
          retention-days: 3
