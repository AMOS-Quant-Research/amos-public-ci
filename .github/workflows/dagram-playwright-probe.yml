name: Dagram public Playwright probe
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/dagram/**'
      - '.github/workflows/dagram-playwright-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright==1.56.0 pandas==2.2.3
      - run: python -m playwright install --with-deps chromium
      - run: PYTHONPATH=. python -m unittest research.dagram.test_vibe_signal_bridge research.dagram.test_public_observation -v
      - run: python research/dagram/probe.py
      - name: Record public snapshot observation times (research only)
        if: always()
        run: |
          if [ -f artifacts/dagram/summary.json ]; then
            python research/dagram/public_observation.py artifacts/dagram/summary.json --captured-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --output artifacts/dagram/observations.jsonl
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dagram-public-probe
          path: artifacts/dagram/
          retention-days: 3

