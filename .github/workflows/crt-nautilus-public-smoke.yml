name: CRT Nautilus public runner smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/crt-nautilus-public-smoke.yml'
permissions:
  contents: read
jobs:
  nautilus-public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NautilusTrader
        run: python -m pip install --pre 'nautilus_trader>=2.0.0rc1'
      - name: Verify Nautilus API and synthetic quote processing
        run: |
          python - <<'PY'
          import inspect
          import nautilus_trader
          # WR1-WR5 are frozen and intentionally excluded from this workflow.
          from nautilus_trader.backtest import BacktestNode
          from nautilus_trader.config import BacktestRunConfig, BacktestEngineConfig
          from nautilus_trader.model import QuoteTick
          print("Nautilus version:", getattr(nautilus_trader, "__version__", "unknown"))
          print("BacktestNode methods:", [n for n in dir(BacktestNode) if "strategy" in n.lower()])
          print("BacktestNode.add_strategy signature:", inspect.signature(BacktestNode.add_strategy) if hasattr(BacktestNode,'add_strategy') else 'NOT_PRESENT')
          print("BacktestNode.add_builtin_strategy signature:", inspect.signature(BacktestNode.add_builtin_strategy) if hasattr(BacktestNode,'add_builtin_strategy') else 'NOT_PRESENT')
          print("BacktestRunConfig fields:", list(getattr(BacktestRunConfig, "__struct_fields__", [])))
          print("BacktestEngineConfig fields:", list(getattr(BacktestEngineConfig, "__struct_fields__", [])))
          print("QuoteTick:", QuoteTick)
          assert BacktestNode and QuoteTick
          import json
          with open('crt-api-report.json','w') as f:
              json.dump({'version':getattr(nautilus_trader,'__version__','unknown'), 'backtest_node_strategy_methods':[n for n in dir(BacktestNode) if 'strategy' in n.lower()], 'add_strategy_signature':str(inspect.signature(BacktestNode.add_strategy)) if hasattr(BacktestNode,'add_strategy') else None, 'run_config_fields':list(getattr(BacktestRunConfig,'__struct_fields__',[])), 'engine_config_fields':list(getattr(BacktestEngineConfig,'__struct_fields__',[])), 'real_raw_tick':False, 'kpi':None},f,indent=2)
          PY
      - name: Execute synthetic CRT research logic (no private data)
        run: python -m unittest discover -s tests -p 'test_crt_synthetic.py' -v
      - name: Execute Nautilus BacktestEngine synthetic QuoteTick BT
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from decimal import Decimal
          from nautilus_trader.backtest import BacktestEngine
          from nautilus_trader.config import BacktestEngineConfig
          from nautilus_trader.model import AccountType, OmsType, BookType, Currency, Price, Quantity, QuoteTick, Money
          from nautilus_trader.backtest.models import MakerTakerFeeModel
          from nautilus_trader.testkit.providers import TestInstrumentProvider
          from nautilus_trader.examples.strategies.ema_cross import EMACross, EMACrossConfig
          import json
          instrument=TestInstrumentProvider.default_fx_ccy("AUD/USD")
          engine=BacktestEngine(BacktestEngineConfig())
          engine.add_venue(venue=instrument.id.venue,oms_type=OmsType.HEDGING,account_type=AccountType.MARGIN,starting_balances=[Money.from_str("1000000 USD")],base_currency=Currency.from_str("USD"),book_type=BookType.L1_MBP,fee_model=MakerTakerFeeModel(maker_rate=Decimal("0"),taker_rate=Decimal("0")))
          engine.add_instrument(instrument)
          engine.add_strategy(EMACross(EMACrossConfig(instrument_id=instrument.id,trade_size=Quantity.from_int(100000),fast_period=3,slow_period=7)))
          ticks=[]
          base=1_800_000_000_000_000_000
          for i in range(300):
              mid=Decimal("0.70")+Decimal(i%40-20)/Decimal("10000")
              ticks.append(QuoteTick(instrument_id=instrument.id,bid_price=Price.from_str(str(mid)),ask_price=Price.from_str(str(mid+Decimal("0.0002"))),bid_size=Quantity.from_int(1000000),ask_size=Quantity.from_int(1000000),ts_event=base+i*1000000000,ts_init=base+i*1000000000))
          engine.add_data(ticks)
          engine.run()
          result=engine.get_result()
          report={"kind":"nautilus_synthetic_bt","real_raw_tick":False,"strategy":"EMACross","ticks":len(ticks),"total_orders":result.total_orders,"total_positions":result.total_positions,"stats_pnls":str(result.stats_pnls),"stats_returns":str(result.stats_returns)}
          print(json.dumps(report,indent=2))
          with open("synthetic-bt.json","w") as out:json.dump(report,out,indent=2)
          assert result.total_orders>0,"BT produced no orders"
          PY
      - name: Write public verification report
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          bt=pathlib.Path("synthetic-bt.json")
          payload={"kind":"public_nautilus_smoke","real_raw_tick":False,"synthetic_bt_executed":bt.exists(),"crt_snr_real_bt_executed":False,"kpi":None}
          pathlib.Path("crt-public-smoke.json").write_text(json.dumps(payload,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crt-nautilus-public-api-smoke
          path: |
            crt-public-smoke.json
            crt-api-report.json
            synthetic-bt.json
