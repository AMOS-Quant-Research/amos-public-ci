name: AMOS IB cTrader Cloud Runtime Validate

on:
  pull_request:
    paths:
      - 'modules/ib-ctrader-cloud-runtime/**'
      - '.github/workflows/ib_ctrader_cloud_runtime.yml'
  push:
    branches: [main]
    paths:
      - 'modules/ib-ctrader-cloud-runtime/**'
      - '.github/workflows/ib_ctrader_cloud_runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ib-ctrader-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: modules/ib-ctrader-cloud-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: |
          python -m pip install -e .
          python -m unittest discover -s tests -v
      - name: Compile synthetic tenant plan
        run: python -m amos_mesh plan examples/tenant-demo.json
