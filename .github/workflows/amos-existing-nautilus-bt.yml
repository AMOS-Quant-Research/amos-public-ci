name: AMOS Existing Nautilus Raw Tick BT
on:
  push:
    branches: [integration/autoscope-101]
    paths:
      - '.github/workflows/amos-existing-nautilus-bt.yml'
      - 'integrations/autoscope/nautilus_bt_trigger.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  xauusd-real-bt:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout existing verified Nautilus research source
        uses: actions/checkout@v4
        with:
          repository: Sai310421/xauusd-data
          ref: c28cb25970d7a72f6a1decc1aadbc358219a6c91
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original research dependencies
        run: python -m pip install 'nautilus_trader==1.230.0' pandas numpy
      - name: Build real Dukascopy XAUUSD Bid Ask QuoteTick catalog
        run: |
          python research/build_raw_bidask_catalog_duka.py \
            --start 2026-10-19 --days 1 --catalog catalog/raw_bidask \
            --symbols XAUUSD --workers 8 --fresh
      - name: Validate real quote catalog
        run: python research/raw_bidask_catalog_guard.py --catalog catalog/raw_bidask --symbols XAUUSD
      - name: Execute existing G75 Nautilus BacktestEngine on raw QuoteTicks
        run: |
          python research/g75_tsugi_mtf_rawtick_v3.py \
            --catalog catalog/raw_bidask --experiment-id autoscope-amos-real-bt-${{ github.run_id }} \
            --gate G1 --variant B --raw-bidask-only
      - name: Upload actual backtest KPI and catalog provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amos-nautilus-real-bt-${{ github.run_id }}
          path: |
            results/ae-bt/autoscope-amos-real-bt-*/cells/*.json
            catalog/raw_bidask/catalog_manifest.json
          if-no-files-found: warn
