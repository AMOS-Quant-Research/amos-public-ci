name: AE Vibe Unattended Native Research Loop
on:
  pull_request:
    paths:
      - 'research/vibe_xauusd/autonomous_research_loop.py'
      - 'research/vibe_xauusd/ai_hypothesis_generator.py'
      - 'research/vibe_xauusd/test_ai_hypothesis_generator.py'
      - 'research/vibe_xauusd/test_nim_provenance.py'
      - 'research/vibe_xauusd/verify_llm_native_proof.py'
      - 'research/vibe_xauusd/test_llm_native_proof.py'
      - 'research/vibe_xauusd/ae_candidate_registry.json'
      - 'research/vibe_xauusd/ae_original_kelly.py'
      - 'research/vibe_xauusd/patch_native_fractional_sizing.py'
      - '.github/workflows/ae-vibe-unattended-loop.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: ae-vibe-research-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore immutable research ledger
        uses: actions/cache/restore@v4
        with:
          path: /tmp/amos-vibe-state/ledger.json
          key: vibe-ae-ledger-${{ github.head_ref || github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            vibe-ae-ledger-${{ github.head_ref || github.ref_name }}-
      - name: Install native engine and data tools
        run: python -m pip install 'nautilus_trader==1.230.0' pandas numpy pyarrow gdown
      - name: Fetch and hash-check pinned XAUUSD Raw Bid Ask package
        run: |
          python -m gdown 'https://drive.google.com/uc?id=1HY3-1htL8rdWaHC_xSiZjPg6Ap6AEknQ' -O /tmp/vibe-original.zip
          echo '56bf3bcfc3221b6cccd9cd64c03425952ebc98baf510e39058b65372772bdf38  /tmp/vibe-original.zip' | sha256sum -c -
      - name: Test closed-loop hypothesis generator
        run: |
          python -m unittest discover -s research/vibe_xauusd -p 'test_ai_hypothesis_generator.py' -v
          python -m unittest discover -s research/vibe_xauusd -p 'test_nim_provenance.py' -v
          python -m unittest discover -s research/vibe_xauusd -p 'test_llm_native_proof.py' -v
      - name: Propose next 3 hypotheses from prior native outcomes
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_NIM_MODEL: ${{ vars.NVIDIA_NIM_MODEL }}
        run: |
          python research/vibe_xauusd/ai_hypothesis_generator.py \
            --ledger /tmp/amos-vibe-state/ledger.json \
            --output /tmp/amos-vibe-state/proposed_candidates.json \
            --count 3
      - name: Run 3 unattended native paper-hypothesis cycles
        env:
          AMOS_AE_GENERATED_CANDIDATES: /tmp/amos-vibe-state/proposed_candidates.json
        run: |
          python research/vibe_xauusd/autonomous_research_loop.py \
            --archive /tmp/vibe-original.zip \
            --output /tmp/amos-vibe-state/run \
            --ledger /tmp/amos-vibe-state/ledger.json \
            --cycles 3
      - name: Verify real LLM hypothesis to Native BT evidence
        run: |
          python research/vibe_xauusd/verify_llm_native_proof.py \
            --proposal /tmp/amos-vibe-state/proposed_candidates.evidence.json \
            --ledger /tmp/amos-vibe-state/ledger.json \
            --summary /tmp/amos-vibe-state/run/autonomous_summary.json \
            --output /tmp/amos-vibe-state/llm_native_proof.json
      - name: Save checkpoint for future unattended cycles
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/amos-vibe-state/ledger.json
          key: vibe-ae-ledger-${{ github.head_ref || github.ref_name }}-${{ github.run_id }}
      - name: Publish actual run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae-vibe-autonomous-${{ github.run_id }}
          path: |
            /tmp/amos-vibe-state/ledger.json
            /tmp/amos-vibe-state/proposed_candidates.json
            /tmp/amos-vibe-state/proposed_candidates.evidence.json
            /tmp/amos-vibe-state/llm_native_proof.json
            /tmp/amos-vibe-state/run/autonomous_summary.json
            /tmp/amos-vibe-state/run/last_failure.json
            /tmp/amos-vibe-state/run/runs/**/run_card.json
            /tmp/amos-vibe-state/run/runs/**/artifacts/*.json
          if-no-files-found: warn
          retention-days: 7
