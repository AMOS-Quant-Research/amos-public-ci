name: Vibe source vendor (one-time, restricted)
on:
  push:
    branches: [research/vibe-xauusd-package-intake-20261028]
    paths: ['.github/workflows/vibe-vendor-once.yml']
permissions:
  contents: write
jobs:
  vendor:
    if: github.repository == 'AMOS-Quant-Research/amos-public-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install gdown
      - name: Download and verify immutable MIT-licensed Vibe package
        run: |
          python -m gdown 'https://drive.google.com/uc?id=1HY3-1htL8rdWaHC_xSiZjPg6Ap6AEknQ' -O /tmp/vibe-source.zip
          echo '56bf3bcfc3221b6cccd9cd64c03425952ebc98baf510e39058b65372772bdf38  /tmp/vibe-source.zip' | sha256sum -c -
      - name: Vendor source-only allowlist (exclude data binaries and secrets)
        run: |
          python - <<'PY'
          import pathlib, zipfile, shutil
          z=zipfile.ZipFile('/tmp/vibe-source.zip')
          prefix='Vibe-Trading/'
          roots=('agent/','frontend/','desktop/','schema/')
          ext={'.py','.md','.txt','.toml','.json','.yaml','.yml','.html','.ts','.tsx','.js','.mjs','.css','.sh','.ps1','.j2','.ini','.cfg','.gitignore'}
          root=pathlib.Path('vendor/vibe-trading')
          count=0
          for info in z.infolist():
              n=info.filename
              if not n.startswith(prefix) or info.is_dir(): continue
              rel=n[len(prefix):]; p=pathlib.PurePosixPath(rel)
              if not (rel.startswith(roots) or rel in ('LICENSE','README.md','pyproject.toml','requirements-lock.txt')): continue
              if info.file_size>750000 or (p.suffix.lower() not in ext and rel not in ('LICENSE','README.md')): continue
              if any(k in rel.lower() for k in ('node_modules/','__pycache__/','.env','/fixtures/','/assets/','/data/','/secrets/','.pem','.key','token')): continue
              if p.is_absolute() or '..' in p.parts: raise ValueError('unsafe archive path')
              dest=root.joinpath(*p.parts)
              dest.parent.mkdir(parents=True,exist_ok=True)
              with z.open(info) as src, dest.open('wb') as dst: shutil.copyfileobj(src,dst)
              count+=1
          if count<1000 or not (root/'agent/backtest/engines/nautilus_vibe_driver.py').exists() or not (root/'LICENSE').exists(): raise RuntimeError('incomplete source-only vendor')
          print('PERSISTENT_SOURCE_FILES',count)
          PY
      - name: Commit source to this research branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/vibe-trading
          git diff --cached --quiet && exit 0
          git commit -m 'vendor: persist pinned MIT Vibe-Trading source-only tree'
          git push origin HEAD:refs/heads/research/vibe-xauusd-package-intake-20261028
