name: AMOS Quant Mentor Public CI
on:
  push:
    branches:
      - feat/quant-mentor-public-ci
    paths:
      - 'quant_mentor_ci/**'
      - '.github/workflows/quant-mentor-public-ci.yml'
  pull_request:
    paths:
      - 'quant_mentor_ci/**'
      - '.github/workflows/quant-mentor-public-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mentor-public-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  public-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile public contracts
        run: python -m compileall -q quant_mentor_ci
      - name: Run synthetic contract tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-evidence
          python -m unittest discover -s quant_mentor_ci -p 'test_*.py' -v 2>&1 | tee ci-evidence/unittest.log
      - name: Record scoped public CI receipt
        run: |
          python quant_mentor_ci/public_ci_receipt.py \
            --log ci-evidence/unittest.log \
            --commit "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --exit-code 0 \
            --out ci-evidence/public_ci_receipt.json
      - name: Upload public-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: quant-mentor-public-evidence
          path: ci-evidence/
          retention-days: 14
