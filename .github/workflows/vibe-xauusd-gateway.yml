name: AMOS Vibe XAUUSD Gateway Validate

on:
  pull_request:
    paths:
      - 'modules/vibe_xauusd_gateway/**'
      - 'tests/test_vibe_xauusd_gateway.py'
      - '.github/workflows/vibe-xauusd-gateway.yml'
  push:
    branches: [main]
    paths:
      - 'modules/vibe_xauusd_gateway/**'
      - 'tests/test_vibe_xauusd_gateway.py'
      - '.github/workflows/vibe-xauusd-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run fail-closed gateway tests
        run: python -m unittest tests/test_vibe_xauusd_gateway.py -v
