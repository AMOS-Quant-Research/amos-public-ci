name: Polars Tick Engine Tests
on:
  push:
    branches: [feat/polars-tick-engine-20261107]
  pull_request:
    paths:
      - 'modules/polars_tick_engine.py'
      - 'tests/test_polars_tick_engine.py'
      - 'requirements-polars.txt'
      - '.github/workflows/polars-tick-engine.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-polars.txt
      - run: python -m pytest -q tests/test_polars_tick_engine.py
