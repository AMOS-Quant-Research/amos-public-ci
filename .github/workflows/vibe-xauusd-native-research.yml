name: Vibe XAUUSD Native AE Watch Research

on:
  pull_request:
    paths:
      - 'research/vibe_xauusd/run_ae_watch_native.py'
      - '.github/workflows/vibe-xauusd-native-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nautilus-raw-bidask:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public research dependencies
        run: python -m pip install 'nautilus_trader==1.230.0' pandas numpy pyarrow gdown
      - name: Fetch original public Drive package
        run: |
          python -m gdown 'https://drive.google.com/uc?id=1HY3-1htL8rdWaHC_xSiZjPg6Ap6AEknQ' -O /tmp/XAUUSD_Vibe_Trading_Complete_Package.zip
          echo '56bf3bcfc3221b6cccd9cd64c03425952ebc98baf510e39058b65372772bdf38  /tmp/XAUUSD_Vibe_Trading_Complete_Package.zip' | sha256sum -c -
      - name: Run two real Nautilus Raw Bid/Ask research candidates
        run: |
          python research/vibe_xauusd/run_ae_watch_native.py --archive /tmp/XAUUSD_Vibe_Trading_Complete_Package.zip --output /tmp/ae_watch_run
      - name: Upload run cards and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae-watch-native-evidence
          path: /tmp/ae_watch_run/runs/**/artifacts/*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload batch result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae-watch-native-results
          path: /tmp/ae_watch_run/batch_result.json
          if-no-files-found: warn
          retention-days: 7
