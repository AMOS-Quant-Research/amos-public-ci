name: AMOS public-safe agent runner preflight
on:
  pull_request:
    paths:
      - '.github/workflows/amos-agent-runner-preflight.yml'
      - 'tests/test_runner_preflight.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runner-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Python unit checks
        run: python3 -m unittest discover -s tests -p 'test_runner_preflight.py' -v
      - name: Install OpenCode CLI without credentials
        shell: bash
        run: |
          npm install --global opencode-ai
          opencode --version
      - name: Agent CLI availability (diagnostic only)
        shell: bash
        run: |
          if command -v claude >/dev/null 2>&1; then
            echo 'CLAUDE_CLI_AVAILABLE=true'
          else
            echo 'CLAUDE_CLI_AVAILABLE=false'
          fi
          if command -v opencode >/dev/null 2>&1; then
            echo 'OPENCODE_CLI_AVAILABLE=true'
          else
            echo 'OPENCODE_CLI_AVAILABLE=false'
          fi
          echo 'No provider keys are accessed, no agent invocation occurs.'
      - name: OpenCode zero-cost model smoke (public synthetic only)
        shell: bash
        timeout-minutes: 4
        env:
          OPENCODE_DISABLE_AUTOUPDATE: "true"
        run: |
          rm -f agent_result.py
          set +e
          timeout 110s opencode run --model opencode/nemotron-3.5-lightning-free --agent build "Create a file named agent_result.py containing exactly: ANSWER = 7. Do not touch other files or execute external commands. This is a synthetic public test." > opencode_run.log 2>&1
          agent_exit=$?
          set -e
          cat opencode_run.log
          echo "AGENT_EXIT_CODE=$agent_exit"
          test -f agent_result.py
          python3 -c "from agent_result import ANSWER; assert ANSWER == 7"
          echo "AGENT_FILE_VALIDATED=true"
          if [ "$agent_exit" -eq 124 ]; then
            echo "AGENT_PROCESS_TIMEOUT=true (not clean agent completion; file tests passed)"
          elif [ "$agent_exit" -ne 0 ]; then
            echo "Agent exited with a non-timeout error" >&2
            exit "$agent_exit"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opencode-public-synthetic-evidence
          path: |
            opencode_run.log
            agent_result.py
          if-no-files-found: warn
          retention-days: 1
