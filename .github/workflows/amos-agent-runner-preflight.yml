name: AMOS public-safe agent runner preflight
on:
  pull_request:
    paths:
      - '.github/workflows/amos-agent-runner-preflight.yml'
      - 'tests/test_runner_preflight.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runner-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Python unit checks
        run: python3 -m unittest discover -s tests -p 'test_runner_preflight.py' -v
      - name: Install OpenCode CLI without credentials
        shell: bash
        run: |
          npm install --global opencode-ai
          opencode --version
      - name: Agent CLI availability (diagnostic only)
        shell: bash
        run: |
          if command -v claude >/dev/null 2>&1; then
            echo 'CLAUDE_CLI_AVAILABLE=true'
          else
            echo 'CLAUDE_CLI_AVAILABLE=false'
          fi
          if command -v opencode >/dev/null 2>&1; then
            echo 'OPENCODE_CLI_AVAILABLE=true'
          else
            echo 'OPENCODE_CLI_AVAILABLE=false'
          fi
          echo 'No provider credentials are used in this public test.'
      - name: OpenCode zero-cost model smoke (public synthetic only)
        shell: bash
        timeout-minutes: 4
        env:
          OPENCODE_DISABLE_AUTOUPDATE: "true"
        run: |
          rm -f agent_result.py opencode_run.log
          echo 'Launching public synthetic OpenCode task (no credentials)'
          set +e
          timeout --signal=TERM --kill-after=5s 160s opencode run --model opencode/nemotron-3.5-lightning-free --agent build "Only create agent_result.py in the current repository root with exactly ANSWER = 7 and then finish immediately. Do not execute commands." > opencode_run.log 2>&1 &
          pid=$!
          set -e
          agent_exit=""
          found=false
          # Validate generated file without assuming a model CLI can exit promptly.
          for i in $(seq 1 165); do
            if [ -f agent_result.py ]; then
              found=true
              echo "AGENT_FILE_CREATED=true"
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "AGENT_PROCESS_ENDED_BEFORE_FILE=true"
              break
            fi
            sleep 1
          done
          if [ "$found" = true ]; then
            python3 -c "from agent_result import ANSWER; assert ANSWER == 7"
            echo "AGENT_FILE_VALIDATED=true"
          fi
          # Always stop the bounded worker at the end of this isolated job.
          if kill -0 "$pid" 2>/dev/null; then
            kill -TERM "$pid" 2>/dev/null || true
          fi
          set +e
          wait "$pid"
          agent_exit=$?
          set -e
          echo "AGENT_EXIT_CODE=$agent_exit"
          cat opencode_run.log
          if [ "$found" != true ]; then
            echo "ERROR: no verified model-generated file" >&2
            exit 1
          fi
          echo "AGENT_SYNTHETIC_FILE_SUCCESS=true"
          echo "AGENT_CLEAN_EXIT_UNVERIFIED=true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opencode-public-synthetic-evidence
          path: |
            opencode_run.log
            agent_result.py
          if-no-files-found: warn
          retention-days: 1
