name: AMOS public-safe agent runner preflight
on:
  pull_request:
    paths:
      - '.github/workflows/amos-agent-runner-preflight.yml'
      - 'tests/test_runner_preflight.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runner-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Python unit checks
        run: python3 -m unittest discover -s tests -p 'test_runner_preflight.py' -v
      - name: Install OpenCode CLI without credentials
        shell: bash
        run: |
          npm install --global opencode-ai
          opencode --version
      - name: Agent CLI availability (diagnostic only)
        shell: bash
        run: |
          if command -v claude >/dev/null 2>&1; then
            echo 'CLAUDE_CLI_AVAILABLE=true'
          else
            echo 'CLAUDE_CLI_AVAILABLE=false'
          fi
          if command -v opencode >/dev/null 2>&1; then
            echo 'OPENCODE_CLI_AVAILABLE=true'
          else
            echo 'OPENCODE_CLI_AVAILABLE=false'
          fi
          echo 'No provider credentials are used in this public test.'
      - name: OpenCode generates and validates Issue #5 synthetic code
        shell: bash
        timeout-minutes: 4
        env:
          OPENCODE_DISABLE_AUTOUPDATE: "true"
        run: |
          rm -f agent_result.py tests/test_agent_generated_constant.py opencode_run.log
          echo 'Launching public synthetic OpenCode task for Issue #5 (no credentials)'
          set +e
          timeout --signal=TERM --kill-after=5s 160s opencode run --model opencode/nemotron-3.5-lightning-free --agent build "Implement public Issue #5. Create exactly two files: agent_result.py containing exactly ANSWER = 7, and tests/test_agent_generated_constant.py containing a unittest that imports ANSWER from agent_result and asserts ANSWER == 7. Do not modify or create any other files. Do not use network. Finish immediately." > opencode_run.log 2>&1 &
          pid=$!
          set -e
          found=false
          for i in $(seq 1 165); do
            if [ -f agent_result.py ] && [ -f tests/test_agent_generated_constant.py ]; then
              found=true
              echo "AGENT_ISSUE_5_FILES_CREATED=true"
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "AGENT_PROCESS_ENDED_BEFORE_FILES=true"
              break
            fi
            sleep 1
          done
          if [ "$found" != true ]; then
            echo "ERROR: no complete verified model-generated files" >&2
            exit 1
          fi
          unexpected="$(git status --porcelain | sed -E 's/^...//' | grep -v -E '^(agent_result.py|tests/test_agent_generated_constant.py|opencode_run.log)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "ERROR: generated unexpected paths:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          python3 -m unittest discover -s tests -v
          if kill -0 "$pid" 2>/dev/null; then kill -TERM "$pid" 2>/dev/null || true; fi
          set +e
          wait "$pid"
          agent_exit=$?
          set -e
          echo "AGENT_EXIT_CODE=$agent_exit"
          cat opencode_run.log
          echo "AGENT_ISSUE_5_TEST_SUCCESS=true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opencode-public-synthetic-evidence
          path: |
            opencode_run.log
            agent_result.py
            tests/test_agent_generated_constant.py
          if-no-files-found: warn
          retention-days: 1
