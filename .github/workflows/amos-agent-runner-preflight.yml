name: AMOS public-safe agent runner preflight
on:
  pull_request:
    paths:
      - '.github/workflows/amos-agent-runner-preflight.yml'
      - 'tests/test_runner_preflight.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runner-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Python unit checks
        run: python3 -m unittest discover -s tests -p 'test_runner_preflight.py' -v
      - name: Install OpenCode CLI without credentials
        shell: bash
        run: |
          npm install --global opencode-ai
          opencode --version
      - name: Agent CLI availability (diagnostic only)
        shell: bash
        run: |
          if command -v claude >/dev/null 2>&1; then
            echo 'CLAUDE_CLI_AVAILABLE=true'
          else
            echo 'CLAUDE_CLI_AVAILABLE=false'
          fi
          if command -v opencode >/dev/null 2>&1; then
            echo 'OPENCODE_CLI_AVAILABLE=true'
          else
            echo 'OPENCODE_CLI_AVAILABLE=false'
          fi
          echo 'No provider credentials are used in this public test.'
      - name: OpenCode generates authorized Issue #5 test (bounded)
        shell: bash
        timeout-minutes: 4
        env:
          OPENCODE_DISABLE_AUTOUPDATE: "true"
        run: |
          # Issue #5 authorizes writing tests/ only. Fixture is provided by CI, not AI.
          printf 'ANSWER = 7\n' > agent_result.py
          rm -f tests/test_agent_generated_constant.py opencode_run.log
          echo 'Starting bounded public synthetic Issue #5 agent task'
          set +e
          timeout --signal=TERM --kill-after=5s 160s opencode run --model opencode/nemotron-3.5-lightning-free --agent build "Implement public Issue #5. Only create tests/test_agent_generated_constant.py. It must use Python unittest, import ANSWER from agent_result, and assert ANSWER == 7. Do not modify any other file. Finish immediately." > opencode_run.log 2>&1 &
          pid=$!
          set -e
          found=false
          for i in $(seq 1 165); do
            if [ -f tests/test_agent_generated_constant.py ]; then
              found=true
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          # Stop the bounded process on every outcome.
          if kill -0 "$pid" 2>/dev/null; then kill -TERM "$pid" 2>/dev/null || true; fi
          set +e
          wait "$pid"
          agent_exit=$?
          set -e
          echo "AGENT_EXIT_CODE=$agent_exit"
          cat opencode_run.log
          if [ "$found" != true ]; then
            echo "BLOCKED: OpenCode did not generate authorized test in time" >&2
            exit 1
          fi
          unexpected="$(git status --porcelain --untracked-files=all | sed -E 's/^...//' | grep -v -E '^(agent_result.py|tests/test_agent_generated_constant.py|opencode_run.log)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "BLOCKED: out-of-scope writes" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          python3 -m unittest discover -s tests -v
          echo "AGENT_ISSUE_5_TEST_SUCCESS=true"
          echo "AGENT_CLEAN_EXIT_UNVERIFIED=true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opencode-public-synthetic-evidence
          path: |
            opencode_run.log
            agent_result.py
            tests/test_agent_generated_constant.py
          if-no-files-found: warn
          retention-days: 1
