name: Chart Vision MVP
on:
  pull_request:
    paths:
      - 'chart-vision/**'
      - '.github/workflows/chart-vision-mvp.yml'
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m py_compile chart-vision/app.py chart-vision/consensus.py
      - name: Unit tests
        run: cd chart-vision && python -m unittest -v test_app.py test_integration.py test_consensus.py
