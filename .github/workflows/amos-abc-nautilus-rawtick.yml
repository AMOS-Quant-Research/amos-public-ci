name: AMOS ABC Nautilus Real Raw Tick BT
on:
  pull_request:
    paths:
      - '.github/workflows/amos-abc-nautilus-rawtick.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  abc-rawtick:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout existing validated Nautilus research and ABC branch
        uses: actions/checkout@v4
        with:
          repository: Sai310421/xauusd-data
          ref: research/amos-abc-nautilus-rawtick-20261023
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install known successful Nautilus version
        run: python -m pip install 'nautilus_trader==1.230.0' pandas numpy
      - name: Fetch real Dukascopy Bid Ask and build existing catalog
        run: python research/build_raw_bidask_catalog_duka.py --start 2026-10-19 --days 1 --catalog catalog/raw_bidask --symbols XAUUSD --workers 8 --fresh
      - name: Validate raw catalog
        run: python research/raw_bidask_catalog_guard.py --catalog catalog/raw_bidask --symbols XAUUSD
      - name: Run ABC on actual QuoteTicks
        run: python research/amos_abc_nautilus_rawtick_bt.py --catalog catalog/raw_bidask --out results/amos-abc/rawtick-kpi.json
      - name: Upload actual evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amos-abc-rawtick-${{ github.run_id }}
          path: |
            results/amos-abc/rawtick-kpi.json
            catalog/raw_bidask/catalog_manifest.json
          if-no-files-found: warn
