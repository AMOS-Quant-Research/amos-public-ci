name: AMOS Public CI Smoke
on:
  push:
    paths:
      - 'tests/**'
      - 'scripts/**'
      - 'research/ai_trader/**'
      - '.github/workflows/public_ci_smoke.yml'
  pull_request:
    paths:
      - 'tests/**'
      - 'scripts/**'
      - 'research/ai_trader/**'
      - '.github/workflows/public_ci_smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: amos-public-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-polars.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s research/ai_trader -p 'test_*.py' -v
      - run: python -m py_compile scripts/nim_client.py scripts/nim_connectivity.py research/ai_trader/nim_candidate.py
