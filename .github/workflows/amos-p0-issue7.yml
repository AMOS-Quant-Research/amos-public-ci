name: AMOS P0 public synthetic Issue 7
on:
  workflow_dispatch:
permissions:
  contents: write
  issues: read
  pull-requests: write
concurrency:
  group: amos-public-issue-7
  cancel-in-progress: false
jobs:
  synthetic-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Read approved Issue and lock task
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/issue7_worker.py issue
      - name: Contract tests
        run: python3 -m unittest discover -s tests -p 'test_issue7_policy.py' -v
      - name: Install OpenCode
        run: npm install --global opencode-ai && opencode --version
      - name: Run bounded OpenCode free model
        id: agent
        shell: bash
        env:
          OPENCODE_DISABLE_AUTOUPDATE: 'true'
        run: |
          set -euo pipefail
          printf 'ANSWER = 7\n' > agent_result.py
          rm -f tests/test_agent_generated_constant.py
          set +e
          timeout --signal=TERM --kill-after=5s 180s opencode run --model opencode/nemotron-3.5-lightning-free --agent build 'Approved GitHub Issue #7. Create ONLY tests/test_agent_generated_constant.py. Use Python unittest; import ANSWER from agent_result; assert ANSWER == 7. No other edits.' > agent.log 2>&1
          rc=$?
          set -e
          echo "opencode_exit_code=$rc"
          if [[ "$rc" -ne 0 || ! -s tests/test_agent_generated_constant.py ]]; then
            echo "::error::MODEL_OR_FILE_NOT_VERIFIED"; exit 1
          fi
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('amos-loop-evidence.json')
          d=json.loads(p.read_text())
          d.update(agent_version="runtime-opencode",model_provider="opencode",model_name="nemotron-3.5-lightning-free",model_request_succeeded=True,model_response_evidence="agent.log (redacted before publication)",completion_state="PARTIAL")
          p.write_text(json.dumps(d,indent=2))
          PY
      - name: Test and create AI-generated Draft PR
        if: steps.agent.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/issue7_worker.py pr
      - name: Report to existing central PR 42
        if: always()
        env:
          AMOS_CENTRAL_REPORT_TOKEN: ${{ secrets.AMOS_CENTRAL_REPORT_TOKEN }}
        run: python3 scripts/issue7_worker.py report
      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amos-loop-evidence
          path: |
            amos-loop-evidence.json
            agent.log
            tests/test_agent_generated_constant.py
          if-no-files-found: warn
          retention-days: 7
